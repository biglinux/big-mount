name: Tests

# Static checks, the boot path with stubbed devices, translations and
# packaging, on Arch Linux (the base of BigLinux), with the same tools as on
# the users' systems.
# Nothing here touches a disk. A real boot is checked by hand with
# tests/manual-check.sh (see docs/05-boot-tests.md).
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git bash shellcheck gettext python glibc-locales util-linux systemd diffutils
          # The suites must not run as root: permission checks would be meaningless
          useradd --create-home ci

      - uses: actions/checkout@v4

      - name: Prepare the checkout for the test user
        run: |
          chown -R ci:ci "$GITHUB_WORKSPACE"
          # systemd-analyze verify needs this, and a container does not have it
          install -d -m 1777 /run/systemd

      - name: Bash syntax
        run: |
          for f in big-mount/usr/bin/bigmount big-mount/usr/lib/big-mount/*.sh \
                   tests/*.sh locale/*.sh \
                   pkgbuild/PKGBUILD pkgbuild/big-mount.install; do
            bash -n "$f"
          done

      - name: ShellCheck
        shell: bash
        run: |
          shopt -s extglob
          shellcheck -x -P big-mount/usr/lib/big-mount:tests \
            big-mount/usr/bin/bigmount big-mount/usr/lib/big-mount/*.sh \
            locale/*.sh tests/stubs/* tests/!(bigmount.old).sh

      - name: Boot path (stubbed devices)
        run: runuser -u ci -- bash tests/run-tests.sh new

      - name: Translations
        run: runuser -u ci -- bash tests/i18n-tests.sh

      - name: Packaging
        run: runuser -u ci -- bash tests/package-check.sh
